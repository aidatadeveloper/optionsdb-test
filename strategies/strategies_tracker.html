<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy Tracker | optionsdatabase.com</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow-x: hidden;
}
#matrix-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 1;
}
.content {
    position: relative; z-index: 2;
    min-height: 100vh;
    padding: 20px; max-width: 1400px; margin: 0 auto;
}
h1 {
    font-family: 'Orbitron', monospace; font-size: 48px; color: #fff;
    font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    text-shadow: 0 0 5px #0f0, 0 0 15px #0f0, 0 0 25px rgba(0, 255, 0, 0.5);
    margin-bottom: 5px;
}
.subtitle { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 30px; }

/* Summary Cards */
.summary-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 15px; margin-bottom: 15px;
}
.summary-card {
    background: rgba(0,15,0,0.85); border: 1px solid rgba(0,255,0,0.4);
    border-radius: 8px; padding: 20px; text-align: center;
}
.summary-card .label { color: rgba(255,255,255,0.5); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.summary-card .value { font-size: 28px; font-weight: 700; margin-top: 8px; }
.summary-card .value.positive { color: #0f0; }
.summary-card .value.negative { color: #dc3545; }
.summary-card .value.neutral { color: rgba(255,255,255,0.7); }

/* 3D Strategy Carousel */
.carousel-3d-container {
    perspective: 1000px;
    height: 100px;
    position: relative;
    margin: 0 auto 25px auto;
    width: 100%;
    max-width: 800px;
}
.carousel-3d {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
}
.carousel-3d .strat-item {
    position: absolute;
    width: 130px;
    height: 70px;
    left: 50%;
    top: 50%;
    margin-left: -65px;
    margin-top: -35px;
    background: rgba(0, 30, 0, 0.9);
    border: 1px solid rgba(0, 255, 0, 0.3);
    border-radius: 6px;
    color: #0f0;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.5s ease;
    backface-visibility: hidden;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
}
.carousel-3d .strat-item .strat-icon { font-size: 20px; margin-bottom: 4px; }
.carousel-3d .strat-item .strat-label { font-size: 10px; line-height: 1.2; padding: 0 3px; }
.carousel-3d .strat-item.center {
    transform: translateZ(100px) scale(1.15);
    border-color: #0f0;
    box-shadow: 0 0 25px rgba(0, 255, 0, 0.5);
    z-index: 10;
    cursor: default;
}
.carousel-3d .strat-item.left {
    transform: translateX(-150px) translateZ(10px) rotateY(25deg) scale(0.95);
    opacity: 0.85;
}
.carousel-3d .strat-item.left:hover {
    transform: translateX(-145px) translateZ(20px) rotateY(25deg) scale(0.98);
    border-color: #0f0;
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
}
.carousel-3d .strat-item.right {
    transform: translateX(150px) translateZ(10px) rotateY(-25deg) scale(0.95);
    opacity: 0.85;
}
.carousel-3d .strat-item.right:hover {
    transform: translateX(145px) translateZ(20px) rotateY(-25deg) scale(0.98);
    border-color: #0f0;
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
}
.carousel-3d .strat-item.far-left {
    transform: translateX(-210px) translateZ(-60px) rotateY(40deg) scale(0.7);
    opacity: 0.6;
}
.carousel-3d .strat-item.far-right {
    transform: translateX(210px) translateZ(-60px) rotateY(-40deg) scale(0.7);
    opacity: 0.6;
}
.carousel-3d .strat-item.hidden {
    transform: translateX(0) translateZ(-150px) scale(0.5);
    opacity: 0;
    pointer-events: none;
}
@media (max-width: 700px) {
    .carousel-3d-container { height: 90px; transform: scale(0.85); margin: 10px auto 20px auto; }
    .carousel-3d .strat-item { width: 110px; height: 60px; margin-left: -55px; margin-top: -30px; }
    .carousel-3d .strat-item .strat-icon { font-size: 16px; }
    .carousel-3d .strat-item .strat-label { font-size: 9px; }
    .carousel-3d .strat-item.left { transform: translateX(-115px) translateZ(10px) rotateY(25deg) scale(0.9); }
    .carousel-3d .strat-item.right { transform: translateX(115px) translateZ(10px) rotateY(-25deg) scale(0.9); }
}

/* Strategy Sections */
.strategy-section {
    background: rgba(0,15,0,0.85); border: 1px solid rgba(0,255,0,0.4);
    border-radius: 8px; margin-bottom: 20px; overflow: hidden;
}
.strategy-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 15px 20px; cursor: pointer; border-bottom: 1px solid rgba(0,255,0,0.2);
}
.strategy-header:hover { background: rgba(0,255,0,0.1); }
.strategy-name { font-family: 'Orbitron', monospace; font-size: 16px; color: #0f0; letter-spacing: 1px; }
.strategy-stats { display: flex; gap: 20px; font-size: 13px; }
.strategy-stats span { color: rgba(255,255,255,0.6); }
.strategy-body { padding: 15px 20px; }

/* Trade Cards */
.trade-card {
    background: rgba(0,15,0,0.7); border: 1px solid rgba(0,255,0,0.3);
    border-radius: 6px; padding: 15px; margin-bottom: 12px;
    display: grid; grid-template-columns: 1.0fr 1.2fr 1.2fr 1.2fr 1fr; gap: 0; align-items: stretch;
}
.trade-card > div {
    padding: 0 12px;
    border-right: 1px solid rgba(0,255,0,0.15);
    display: flex; flex-direction: column; justify-content: flex-start;
}
.trade-card > div:first-child { padding-left: 0; }
.trade-card > div:last-child { border-right: none; padding-right: 0; }
.trade-card:hover { border-color: rgba(0,255,0,0.5); }
.trade-ticker { font-size: 22px; font-weight: 700; }
.trade-meta { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
.trade-legs { font-size: 12px; font-family: 'Courier New', monospace; line-height: 1.6; }
.trade-legs .sell { color: #dc3545; }
.trade-legs .buy { color: #0f0; }
.trade-pl { text-align: right; }
.trade-pl .pl-value { font-size: 22px; font-weight: 700; }
.trade-pl .pl-label { font-size: 11px; color: rgba(255,255,255,0.4); text-transform: uppercase; }
.trade-pl .pl-detail { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }

/* Status Badges */
.status { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
.status.open { background: rgba(0,255,0,0.15); color: #0f0; border: 1px solid rgba(0,255,0,0.3); }
.status.expired_win { background: rgba(0,255,0,0.2); color: #0f0; border: 1px solid rgba(0,255,0,0.4); }
.status.expired_loss { background: rgba(220,53,69,0.2); color: #dc3545; border: 1px solid rgba(220,53,69,0.4); }
.status.expired_flat { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.2); }

/* P/L Chart (mini sparkline) */
.pl-chart { display: flex; align-items: flex-end; gap: 2px; height: 30px; margin-top: 6px; }
.pl-bar { min-width: 4px; flex: 1; border-radius: 1px; }
.pl-bar.up { background: #0f0; }
.pl-bar.down { background: #dc3545; }

/* Calendar */
.calendar-section { margin-top: 30px; }
.calendar-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
    margin-top: 10px;
}
.cal-header { text-align: center; font-size: 11px; color: rgba(255,255,255,0.4); padding: 5px; }
.cal-day {
    min-height: 70px; padding: 4px; font-size: 11px;
    background: rgba(0,15,0,0.85); border: 1px solid rgba(0,255,0,0.3);
    border-radius: 3px; position: relative;
}
.cal-day.has-activity { cursor: pointer; }
.cal-day.has-activity:hover { border-color: rgba(0,255,0,0.5); background: rgba(0,255,0,0.08); }
.cal-day.today { border-color: rgba(0,255,0,0.4); background: rgba(0,255,0,0.08); }
.cal-day.selected { border-color: #ffd700; background: rgba(255,215,0,0.1); }
.cal-day .day-num { color: rgba(255,255,255,0.4); margin-bottom: 2px; }
.cal-pl { font-size: 11px; font-weight: 600; margin-top: 2px; }
.cal-pl.positive { color: #0f0; }
.cal-pl.negative { color: #dc3545; }
.cal-pl.neutral { color: rgba(255,255,255,0.5); }
.cal-tickers { font-size: 9px; color: rgba(255,255,255,0.4); margin-top: 1px; line-height: 1.3; overflow: hidden; max-height: 28px; }
.cal-tag { display: inline-block; font-size: 8px; padding: 0 3px; border-radius: 2px; margin: 1px 1px 0 0; }
.cal-tag.entry { background: rgba(0,170,255,0.2); color: #0af; }
.cal-tag.expiry { background: rgba(0,255,0,0.15); color: #0f0; }
.cal-tag.expiry-loss { background: rgba(220,53,69,0.2); color: #dc3545; }
.cal-month-nav { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
.cal-month-nav button {
    background: none; border: 1px solid rgba(0,255,0,0.3); color: #0f0;
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
}
.cal-month-nav button:hover { background: rgba(0,255,0,0.1); }
.cal-month-title { font-family: 'Orbitron', monospace; font-size: 16px; color: #0f0; }

/* Day header */
.day-header {
    font-family: 'Orbitron', monospace; font-size: 18px; color: #0f0;
    letter-spacing: 1px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;
}

/* No trades */
.no-trades {
    text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.4);
    font-size: 16px;
}

/* Tooltip */
.tooltip {
    display: none; position: fixed; background: rgba(0,20,0,0.95);
    border: 1px solid rgba(0,255,0,0.5); border-radius: 4px;
    padding: 10px; font-size: 12px; color: #0f0; z-index: 1000;
    max-width: 250px; pointer-events: none;
}

/* Responsive */
@media (max-width: 768px) {
    h1 { font-size: 24px; }
    .summary-row { grid-template-columns: repeat(2, 1fr); }
    .trade-card { grid-template-columns: 1fr; }
    .trade-card > div { border-right: none; border-bottom: 1px solid rgba(0,255,0,0.1); padding: 8px 0; }
    .trade-card > div:last-child { border-bottom: none; }
}
</style>
</head>

let carouselCurrentIndex = 0;
let carouselStrategies = [];
let activeStrategyFilter = 'all';

function getCarouselPositionClass(offset, total) {
    const n = ((offset % total) + total) % total;
    if (n === 0) return 'center';
    if (n === 1) return 'right';
    if (n === total - 1) return 'left';
    if (n === 2) return 'far-right';
    if (n === total - 2) return 'far-left';
    return 'hidden';
}

function formatStratName(s) {
    return s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function initCarousel() {
    const strategies = ['all'];
    const seen = new Set();
    TRADES.forEach(t => {
        if (!seen.has(t.strategy)) {
            seen.add(t.strategy);
            strategies.push(t.strategy);
        }
    });
    carouselStrategies = strategies;
    carouselCurrentIndex = 0; // 'all' is first = center

    const carousel = document.getElementById('carousel3d');
    if (!carousel) return;

    let html = '';
    strategies.forEach((strat, index) => {
        const icon = STRATEGY_ICONS[strat] || '📁';
        const label = strat === 'all' ? 'ALL' : formatStratName(strat);
        const posClass = getCarouselPositionClass(index - carouselCurrentIndex, strategies.length);
        html += '<div class="strat-item ' + posClass + '" data-index="' + index + '" data-strat="' + strat + '" onclick="selectCarouselStrategy(' + index + ')">' +
            '<div class="strat-icon">' + icon + '</div>' +
            '<div class="strat-label">' + label + '</div></div>';
    });
    carousel.innerHTML = html;
    initCarouselSwipe();
}

function updateCarouselPositions() {
    const items = document.querySelectorAll('.strat-item');
    items.forEach((item, index) => {
        const offset = index - carouselCurrentIndex;
        const posClass = getCarouselPositionClass(offset, carouselStrategies.length);
        item.className = 'strat-item ' + posClass;
    });
}

function selectCarouselStrategy(index) {
    if (index === carouselCurrentIndex) return;
    carouselCurrentIndex = index;
    updateCarouselPositions();
    activeStrategyFilter = carouselStrategies[index];
    renderStrategies();

function updateSummaryCards() {
    // Update summary cards to reflect filtered strategy
    let filteredTrades = TRADES;
    if (activeStrategyFilter !== 'all') {
        filteredTrades = TRADES.filter(t => t.strategy === activeStrategyFilter);

    const wins = closedT.filter(t => t.final_pl && t.final_pl > 0);

    const realized = closedT.reduce((s, t) => s + (t.final_pl || 0), 0);
    let unrealized = 0;
    openT.forEach(t => { if (t.daily.length) unrealized += t.daily[t.daily.length - 1].total_pl; });

    const cards = document.querySelectorAll('.summary-card');

function initCarouselSwipe() {
    const carousel = document.getElementById('stratCarousel');
    if (!carousel) return;
    let startX = 0, isDragging = false, isHoriz = false;
    carousel.addEventListener('touchstart', e => {
        isDragging = true; isHoriz = false;
        startX = e.touches[0].clientX;
    }, { passive: true });
    carousel.addEventListener('touchmove', e => {
        if (!isDragging) return;
        if (Math.abs(e.touches[0].clientX - startX) > 10) { isHoriz = true; e.preventDefault(); }
    }, { passive: false });
    carousel.addEventListener('touchend', e => {
        if (!isDragging || !isHoriz) { isDragging = false; return; }
        isDragging = false;
        const deltaX = e.changedTouches[0].clientX - startX;
        if (Math.abs(deltaX) < 50) return;
        const total = carouselStrategies.length;
        if (deltaX > 0) selectCarouselStrategy((carouselCurrentIndex - 1 + total) % total);
        else selectCarouselStrategy((carouselCurrentIndex + 1) % total);
    }, { passive: true });
}

        });

        html += '</div></div>';
    }
    container.innerHTML = html;

// Date/time formatters: m/d/yyyy and m/d/yyyy h:mm AM/PM
function fmtDate(s) {
    if (!s) return '';
    const p = s.split('-');
    if (p.length < 3) return s;
    return parseInt(p[1]) + '/' + parseInt(p[2]) + '/' + p[0];
}
function fmtDateTime(s) {
    if (!s) return '';
    const parts = s.split(' ');
    const datePart = fmtDate(parts[0]);
    if (parts.length < 2) return datePart;
    const tp = parts[1].split(':');
    let h = parseInt(tp[0]);
    const m = tp[1] || '00';
    const ampm = h >= 12 ? 'PM' : 'AM';
    if (h > 12) h -= 12;
    if (h === 0) h = 12;
    return datePart + ' ' + h + ':' + m + ' ' + ampm;
}

        if (t.earnings_context) {
            const ec = t.earnings_context;
            let ecHtml = '<div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,215,0,0.25)">';
            if (ec.upcoming) {
                ecHtml += '<div style="color:#ffd700;font-size:10px;text-transform:uppercase;letter-spacing:1px">Earnings ' +
                    '<span style="color:#fff;font-weight:normal;text-transform:none;letter-spacing:0">' + fmtDate(ec.upcoming.date) + '</span> ' +
                    '<span style="color:#ffd700;font-weight:normal;background:rgba(255,215,0,0.15);padding:1px 5px;border-radius:3px;font-size:9px">' + ec.upcoming.time + '</span>' +
                    '</div>';
            } else {
                ecHtml += '<div style="color:#ffd700;font-size:10px;text-transform:uppercase;letter-spacing:1px">Earnings History</div>';
            }
            if (ec.past && ec.past.length) {
                ecHtml += '<div style="font-size:10px;color:rgba(255,255,255,0.65);margin-top:3px;line-height:1.6">';
                ecHtml += '<div style="color:rgba(255,255,255,0.4);font-size:9px;margin-bottom:1px">Past ' + ec.past.length + ' earnings (theoretical P/L @ today\'s debit):</div>';
                ec.past.forEach(p => {
                    const moveColor = p.move_pct > 0 ? '#0f0' : (p.move_pct < 0 ? '#dc3545' : 'rgba(255,255,255,0.5)');
                    const pnlColor = p.theo_pnl == null ? 'rgba(255,255,255,0.5)' : (p.theo_pnl > 0 ? '#0f0' : (p.theo_pnl < 0 ? '#dc3545' : 'rgba(255,255,255,0.5)'));
                    const pnlStr = p.theo_pnl == null ? '--' : ('$' + (p.theo_pnl >= 0 ? '+' : '') + Math.round(p.theo_pnl).toLocaleString());
                    ecHtml += '<div>' +
                        '<span style="color:rgba(255,255,255,0.5)">' + fmtDate(p.date) + '</span> ' +
                        '<span style="color:rgba(255,255,255,0.4);font-size:9px">' + p.time_class + '</span> ' +
                        '<span style="color:' + moveColor + '">' + (p.move_pct >= 0 ? '+' : '') + p.move_pct.toFixed(2) + '%</span>' +
                        ' <span style="color:' + pnlColor + ';font-weight:600">' + pnlStr + '</span>' +
                        '</div>';
                });
                // Quick stats row: wins / n  and total theo P/L
                let wins = 0, total = 0, counted = 0;
                ec.past.forEach(p => {
                    if (p.theo_pnl == null) return;
                    counted++;
                    if (p.theo_pnl > 0) wins++;
                    total += p.theo_pnl;
                });
                if (counted > 0) {
                    const totalColor = total >= 0 ? '#0f0' : '#dc3545';
                    ecHtml += '<div style="margin-top:2px;padding-top:2px;border-top:1px solid rgba(255,215,0,0.12);font-size:9px;color:rgba(255,255,255,0.5)">' +
                        'Total theo: <span style="color:' + totalColor + '">$' + (total >= 0 ? '+' : '') + Math.round(total).toLocaleString() + '</span> ' +
                        '&middot; ' + wins + '/' + counted + ' win' +
                        '</div>';
                }
                ecHtml += '</div>';
            }
            ecHtml += '</div>';
            openLegsHtml += ecHtml;
        }

        // CURRENT POSITION or CLOSED POSITION
        if (hasCurrentMarks) {
            const posLabel = isExpired ? 'Closed Position' : 'Current Position';
            let curPriceHtml = '';
            if (latestUnderlying && entryPrice) {
                const pctChg = ((latestUnderlying - entryPrice) / entryPrice * 100);
                const pctColor = pctChg > 0 ? '#0f0' : (pctChg < 0 ? '#dc3545' : 'rgba(255,255,255,0.5)');
                curPriceHtml = ' <span style="color:rgba(255,255,255,0.4);font-size:10px;font-family:-apple-system,sans-serif">$' + latestUnderlying.toFixed(2) +
                    ' <span style="color:' + pctColor + '">(' + (pctChg >= 0 ? '+' : '') + pctChg.toFixed(1) + '%)</span></span>';
            } else if (latestUnderlying) {
                curPriceHtml = ' <span style="color:rgba(255,255,255,0.4);font-size:10px;font-family:-apple-system,sans-serif">$' + latestUnderlying.toFixed(2) + '</span>';
            }
            currentLegsHtml += '<div style="margin-bottom:4px"><span style="color:rgba(255,255,255,0.35);font-size:10px;text-transform:uppercase;letter-spacing:1px">' + posLabel + '</span>' + curPriceHtml + '</div>';
            t.legs.forEach((leg, idx) => {
                const cls = leg.action === 'SELL' ? 'sell' : 'buy';
                const cm = currentMarks[idx];
                if (cm !== undefined && cm !== null) {
                    const diff = cm - leg.entry_mark;
                    const diffColor = (leg.action === 'BUY' ? diff >= 0 : diff <= 0) ? '#0f0' : '#dc3545';
                    const curIv = (currentIVs[idx] != null) ? currentIVs[idx] : (lbIVs[idx] != null ? lbIVs[idx] : leg.entry_iv);
                    const curIvStr = ivBadge(curIv, leg.entry_iv);
                    currentLegsHtml += '<span class="' + cls + '">' + leg.action + ' ' + t.num_contracts + 'x ' +
                        (leg.strike % 1 === 0 ? leg.strike.toFixed(0) : leg.strike.toString()) + leg.type[0] + ' ' + legExpShort(leg) +
                        ' @ <span style="color:' + diffColor + '">$' + cm.toFixed(2) + '</span>' + curIvStr + '</span><br>';
                }
            });
            currentLegsHtml += netSummary(t.legs, currentMarks, t.num_contracts);
            if (lastUpdated) {
                currentLegsHtml += '<span style="color:rgba(255,255,255,0.3);font-size:10px">Last: ' + fmtDateTime(lastUpdated) + '</span>';
            }
        }
    }

    // LOOKBACK POSITION (best achievable P/L between entry and expiration)
    // (lbMarks/lbIVs/hasLookback declared above for TDZ safety)
    let lookbackHtml = '';
    if (hasLookback && t.legs) {
        let lbPriceHtml = '';
        if (t.lookback_underlying && entryPrice) {
            const lbPctChg = ((t.lookback_underlying - entryPrice) / entryPrice * 100);
            const lbPctColor = lbPctChg > 0 ? '#0f0' : (lbPctChg < 0 ? '#dc3545' : 'rgba(255,255,255,0.5)');
            lbPriceHtml = ' <span style="color:rgba(255,255,255,0.4);font-size:10px;font-family:-apple-system,sans-serif">$' + t.lookback_underlying.toFixed(2) +
                ' <span style="color:' + lbPctColor + '">(' + (lbPctChg >= 0 ? '+' : '') + lbPctChg.toFixed(1) + '%)</span></span>';
        } else if (t.lookback_underlying) {
            lbPriceHtml = ' <span style="color:rgba(255,255,255,0.4);font-size:10px;font-family:-apple-system,sans-serif">$' + t.lookback_underlying.toFixed(2) + '</span>';
        }
        lookbackHtml += '<div style="margin-bottom:4px"><span style="color:#ffd700;font-size:10px;text-transform:uppercase;letter-spacing:1px">Lookback Position</span>' + lbPriceHtml + '</div>';
        t.legs.forEach((leg, idx) => {
            const cls = leg.action === 'SELL' ? 'sell' : 'buy';
            const lm = lbMarks[idx];
            if (lm !== undefined && lm !== null) {
                const diff = lm - leg.entry_mark;
                const diffColor = (leg.action === 'BUY' ? diff >= 0 : diff <= 0) ? '#0f0' : '#dc3545';
                const lbIv = (lbIVs[idx] != null) ? lbIVs[idx] : leg.entry_iv;
                const lbIvStr = ivBadge(lbIv, leg.entry_iv);
                lookbackHtml += '<span class="' + cls + '">' + leg.action + ' ' + t.num_contracts + 'x ' +
                    (leg.strike % 1 === 0 ? leg.strike.toFixed(0) : leg.strike.toString()) + leg.type[0] + ' ' + legExpShort(leg) +
                    ' @ <span style="color:' + diffColor + '">$' + lm.toFixed(2) + '</span>' + lbIvStr + '</span><br>';
            }
        });
        lookbackHtml += netSummary(t.legs, lbMarks, t.num_contracts);
        if (t.lookback_best_date) {
            lookbackHtml += '<span style="color:#ffd700;font-size:10px;opacity:0.6">Best: ' + fmtDateTime(t.lookback_best_date) + '</span>';
        }
    }

    // Mini P/L chart
    let chartHtml = '';
    if (t.daily.length > 1) {
        const maxAbs = Math.max(...t.daily.map(d => Math.abs(d.total_pl)), 1);
        chartHtml = '<div class="pl-chart">';
        t.daily.forEach(d => {
            const h = Math.max(Math.abs(d.total_pl) / maxAbs * 30, 2);
            const cls = d.total_pl >= 0 ? 'up' : 'down';
            chartHtml += '<div class="pl-bar ' + cls + '" style="height:' + h + 'px" title="' + d.date + ': $' + d.total_pl.toFixed(2) + '"></div>';
        });
        chartHtml += '</div>';
    }

    const statusCls = t.status.replace(' ', '_');
    const daysLeft = t.status === 'open' ? Math.max(0, Math.ceil((new Date(t.expiration_date) - new Date()) / 86400000)) : 0;

    // Build dual P/L column: LOOKBACK P/L on top, CURRENT/CLOSED P/L below
    const lbPl = t.lookback_best_pl;
    const lbPlStr = lbPl !== null && lbPl !== undefined ? '$' + (lbPl >= 0 ? '+' : '') + lbPl.toLocaleString(undefined, {minimumFractionDigits:2}) : '--';
    const lbPlColor = lbPl !== null && lbPl !== undefined ? (lbPl >= 0 ? '#ffd700' : '#dc3545') : 'rgba(255,255,255,0.4)';

    return '<div class="trade-card">' +
        '<div>' +
            '<div class="trade-ticker"><a href="../tickers/' + t.ticker + '/' + t.ticker + '_latest.html" style="color:inherit;text-decoration:none">' + t.ticker + '</a></div>' +
            (t.status === 'open' ? '<div class="trade-meta"><span class="status open">OPEN</span> <span style="color:rgba(255,255,255,0.4)">' + daysLeft + 'd left</span></div>' : '') +
            '<div class="trade-meta">' + fmtDate(t.entry_date) + ' -> ' + fmtDate(t.expiration_date) + '</div>' +
            '<div class="trade-meta">' + t.trade_type.replace(/_/g, ' ') + ' | ' + t.direction + ' $' + Math.abs(t.entry_net).toFixed(2) + '/spread</div>' +
        '</div>' +
        '<div class="trade-legs">' + openLegsHtml + '</div>' +
        '<div class="trade-legs">' + lookbackHtml + '</div>' +
        '<div class="trade-legs">' + currentLegsHtml + '</div>' +
        '<div class="trade-pl">' +
            '<div style="margin-bottom:10px">' +
                '<div class="pl-label" style="color:#ffd700">LOOKBACK P/L</div>' +
                '<div class="pl-value" style="color:' + lbPlColor + '">' + lbPlStr + '</div>' +
            '</div>' +
            '<div>' +
                '<div class="pl-label">' + plLabel + '</div>' +
                '<div class="pl-value" style="color:' + (plValue >= 0 ? '#0f0' : '#dc3545') + '">' + plStr + '</div>' +
            '</div>' +
            '<div class="pl-detail">' + t.num_contracts + ' contracts | max risk $' + t.max_risk.toFixed(0) + '</div>' +
            chartHtml +
        '</div>' +
    '</div>';
}

// ---- Calendar ----
let calYear, calMonth;
(function() {
    const d = new Date();
    calYear = d.getFullYear();
    calMonth = d.getMonth();
})();

function changeMonth(delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
}

// Build calendar data maps - group trades by entry_date
function buildCalendarData() {
    const dayData = {};  // dateStr -> { trades: [], lookbackPL: number, finalPL: number }

    const filtered = activeStrategyFilter === 'all' ? TRADES :
        TRADES.filter(t => t.strategy === activeStrategyFilter);

    filtered.forEach(t => {
        const ed = t.entry_date;
        if (!dayData[ed]) dayData[ed] = { trades: [], lookbackPL: 0, finalPL: 0 };
        dayData[ed].trades.push(t);
        dayData[ed].lookbackPL += (t.lookback_best_pl || 0);
        // Final P/L: use final_pl for closed, latest daily for open
        const pl = t.status !== 'open' ? (t.final_pl || 0) :
            (t.daily.length ? t.daily[t.daily.length - 1].total_pl : 0);
        dayData[ed].finalPL += pl;
    });

    return dayData;
}

function renderCalendar() {
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    document.getElementById('calMonthTitle').textContent = monthNames[calMonth] + ' ' + calYear;

    const grid = document.getElementById('calGrid');
    const today = new Date();
    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const dayData = buildCalendarData();

    let html = '';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
        html += '<div class="cal-header">' + d + '</div>';
    });

    for (let i = 0; i < firstDay; i++) html += '<div class="cal-day"></div>';

    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
        const isToday = today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === day;
        const dd = dayData[dateStr];
        const hasActivity = dd && dd.trades.length > 0;

        html += '<div class="cal-day' + (isToday ? ' today' : '') + (hasActivity ? ' has-activity' : '') + '"' +
            ' data-date="' + dateStr + '"' +
            (hasActivity ? ' onclick="selectDay(\'' + dateStr + '\')"' : '') + '>';
        html += '<div class="day-num">' + day + '</div>';

        if (dd && hasActivity) {
            html += '<div style="font-size:9px;color:#ffd700">L $' + (dd.lookbackPL >= 0 ? '+' : '') + dd.lookbackPL.toFixed(0) + '</div>';
            const fColor = dd.finalPL >= 0 ? '#0f0' : '#dc3545';
            html += '<div style="font-size:9px;color:' + fColor + '">F $' + (dd.finalPL >= 0 ? '+' : '') + dd.finalPL.toFixed(0) + '</div>';
        }

        html += '</div>';
    }

    grid.innerHTML = html;
}

let selectedDate = null;

function selectDay(dateStr) {
    selectedDate = dateStr;
    const dayData = buildCalendarData();
    const dd = dayData[dateStr];

    const headerEl = document.getElementById('day-trades-header');
    const containerEl = document.getElementById('day-trades-container');

    const title = fmtDate(dateStr);

    if (!dd || !dd.trades.length) {
        headerEl.innerHTML = '<div class="day-header">' + title + ' <span style="color:rgba(255,255,255,0.4);font-size:13px;font-family:-apple-system,sans-serif">No trades</span></div>';
        containerEl.innerHTML = '';
        highlightCalDay(dateStr);
        return;
    }

    const lbColor = dd.lookbackPL >= 0 ? '#ffd700' : '#dc3545';
    const fColor = dd.finalPL >= 0 ? '#0f0' : '#dc3545';
    headerEl.innerHTML = '<div class="day-header">' + title +
        '  <span style="color:' + lbColor + ';font-family:-apple-system,sans-serif;font-size:14px">Lookback $' + (dd.lookbackPL >= 0 ? '+' : '') + dd.lookbackPL.toLocaleString(undefined, {minimumFractionDigits:0}) + '</span>' +
        '  <span style="color:' + fColor + ';font-family:-apple-system,sans-serif;font-size:14px">Final $' + (dd.finalPL >= 0 ? '+' : '') + dd.finalPL.toLocaleString(undefined, {minimumFractionDigits:0}) + '</span>' +
        '  <span style="color:rgba(255,255,255,0.4);font-size:12px">' + dd.trades.length + ' trade' + (dd.trades.length > 1 ? 's' : '') + '</span>' +
        '</div>';

    // Render trade cards directly (no strategy grouping - already under date header)
    let html = '';
    const trades = dd.trades;
    {
        trades.forEach(t => { html += renderTradeCard(t); });
    }

    containerEl.innerHTML = html;
    highlightCalDay(dateStr);
}

function highlightCalDay(dateStr) {
    document.querySelectorAll('.cal-day.selected').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.cal-day').forEach(el => {
        if (el.getAttribute('data-date') === dateStr) el.classList.add('selected');
    });
}


// ---- Matrix Rain ----
function initMatrixRain() {
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = '01';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0f03';
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            const char = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(char, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 50);
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
}

// ---- Init ----
initMatrixRain();
initCarousel();
renderStrategies();
renderCalendar();

// Default to today's date
(function() {
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    selectDay(todayStr);
})();
</script>
