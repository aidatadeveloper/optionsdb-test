<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Database - Earnings Screener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta name="cicd-status" content="none">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="earnings_DAILY_CALENDAR.js"></script>
    <script src="CICD_RESULTS.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overscroll-behavior-x: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        #matrix-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }
        .content {
            position: relative; z-index: 2;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* Header */
        header {
            padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo {
            display: flex; align-items: center; gap: 8px;
            font-size: 18px; font-weight: 600; cursor: pointer; position: relative;
        }
        .logo-icon {
            width: 24px; height: 24px; border: 2px solid #0f0; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #0f0;
        }
        .dropdown {
            position: absolute; top: 100%; left: 0; margin-top: 10px;
            background: rgba(0, 15, 0, 0.85); border: 1px solid rgba(0, 255, 0, 0.4);
            border-radius: 8px; min-width: 180px; display: none; z-index: 1000;
            box-shadow: 0 8px 16px rgba(0, 255, 0, 0.2);
        }
        .dropdown.active { display: block; }
        .dropdown a {
            display: block; padding: 12px 20px; color: #0f0; text-decoration: none;
            font-size: 16px; transition: all 0.3s;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2); text-align: center;
        }
        .dropdown a:last-child { border-bottom: none; }
        .dropdown a:hover { background: rgba(0, 255, 0, 0.15); }
        .apply-btn {
            background: transparent; border: 1px solid #0f0; color: #0f0;
            padding: 8px 20px; border-radius: 4px; cursor: pointer;
            font-size: 14px; transition: all 0.3s; text-decoration: none;
        }
        .apply-btn:hover { background: #0f0; color: #000; }

        main {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; padding: 20px;
        }
        .page-header { text-align: center; margin-bottom: 30px; }
        .page-title {
            font-family: 'Orbitron', monospace; font-size: 48px; font-weight: 700;
            letter-spacing: 4px; text-transform: uppercase; color: #fff;
            text-shadow: 0 0 5px #0f0, 0 0 15px #0f0, 0 0 25px rgba(0, 255, 0, 0.5);
            margin-bottom: 10px;
        }
        /* subtitle removed to match UA screener layout */

        /* Trade Date */
        .trade-date-display { text-align: center; padding: 15px 0; margin-bottom: 10px; }
        .trade-date-display span {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 18px; color: #fff; font-weight: 400;
            cursor: pointer; transition: opacity 0.2s;
        }
        .trade-date-display span:hover { opacity: 0.8; }
        .trade-data-subline {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12px; color: rgba(255, 255, 255, 0.6); font-weight: 300;
            margin-top: 2px; display: flex;
            align-items: center; justify-content: center; gap: 10px;
        }
        .trade-data-subline .subline-text { white-space: nowrap; font-size: 12px; color: rgba(255, 255, 255, 0.6); font-weight: 300; }

        /* BMO/AMC Timing Filter Buttons */
        .timing-filter-row {
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .timing-filter-btn {
            background: transparent; border: 1px solid rgba(0, 255, 0, 0.3); color: rgba(0, 255, 0, 0.5);
            padding: 4px 14px; border-radius: 4px; cursor: pointer;
            font-size: 12px; font-weight: 600; letter-spacing: 1px;
            transition: all 0.3s; text-transform: uppercase;
        }
        .timing-filter-btn:hover { border-color: rgba(0, 255, 0, 0.6); color: rgba(0, 255, 0, 0.8); }
        .timing-filter-btn.active {
            background: rgba(0, 255, 0, 0.15); border-color: #0f0; color: #0f0;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
        }
        .carousel-with-filters {
            display: flex; align-items: center; justify-content: center;
            gap: 15px; width: 100%; max-width: 900px;
        }
        .timing-row-below {
            display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: -5px; margin-bottom: 12px;
        }
        .timing-row-below .timing-filter-btn { padding: 6px 24px; border-radius: 20px; }
        .vol-slider-group {
            display: flex; align-items: center; gap: 6px;
        }
        .vol-slider-label {
            font-size: 11px; color: rgba(0, 255, 0, 0.6); font-weight: 600; letter-spacing: 1px; white-space: nowrap;
        }
        .vol-slider-val {
            font-size: 11px; color: #0f0; font-weight: 600; min-width: 36px; text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .vol-slider {
            -webkit-appearance: none; appearance: none; width: 80px; height: 4px;
            background: rgba(0, 255, 0, 0.2); border-radius: 2px; outline: none; cursor: pointer;
        }
        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
            background: #0f0; border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 255, 0, 0.5);
        }
        .vol-slider::-moz-range-thumb {
            width: 14px; height: 14px; background: #0f0; border-radius: 50%;
            cursor: pointer; border: none; box-shadow: 0 0 6px rgba(0, 255, 0, 0.5);
        }

        /* Date Picker */
        .date-picker-backdrop {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 99998;
        }
        .date-picker-backdrop.active { display: block; }
        .date-picker-container { position: relative; display: inline-block; }
        .date-picker-dropdown {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgb(0, 20, 0); border: 2px solid rgba(0, 255, 0, 0.6);
            border-radius: 12px; padding: 20px;
            box-shadow: 0 0 60px rgba(0, 255, 0, 0.4);
            z-index: 99999; min-width: 300px; max-width: 90vw;
        }
        .date-picker-dropdown.active {
            display: block; animation: fadeInPicker 0.2s ease;
        }
        @keyframes fadeInPicker {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .calendar-nav {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        .calendar-nav-btn {
            background: transparent; border: 1px solid rgba(0, 255, 0, 0.4);
            color: #0f0; width: 30px; height: 30px; border-radius: 4px;
            cursor: pointer; font-size: 16px; transition: all 0.3s;
        }
        .calendar-nav-btn:hover { background: rgba(0, 255, 0, 0.1); border-color: #0f0; }
        .calendar-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .calendar-header {
            font-family: 'Orbitron', monospace; text-align: center; font-weight: bold;
            color: #0f0; font-size: 14px; letter-spacing: 2px;
        }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day-header {
            text-align: center; font-size: 11px; color: rgba(0, 255, 0, 0.5);
            padding: 8px 0; font-weight: 600;
        }
        .calendar-day {
            text-align: center; padding: 10px 5px; border-radius: 4px;
            cursor: pointer; transition: all 0.2s; font-size: 13px;
            color: #0f0; min-width: 36px;
        }
        .calendar-day:hover:not(.disabled):not(.empty):not(.no-data) { background: rgba(0, 255, 0, 0.2); }
        .calendar-day.selected { background: #0f0; color: #000; font-weight: bold; }
        .calendar-day.disabled, .calendar-day.empty { color: rgba(0, 255, 0, 0.15); cursor: default; }
        .calendar-day.has-data { position: relative; }
        .calendar-day.has-data::after {
            content: ''; position: absolute; bottom: 2px; left: 50%;
            transform: translateX(-50%); width: 4px; height: 4px;
            background: #0f0; border-radius: 50%;
        }
        .date-picker-message {
            margin-top: 12px; padding: 10px; border-radius: 4px;
            font-size: 12px; text-align: center; display: none;
        }
        .date-picker-message.error {
            display: block; background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.3); color: #f55;
        }

        /* View Toggle */
        .view-toggle {
            display: flex; justify-content: center; align-items: center;
            position: relative; z-index: 100; gap: 0; padding: 12px 0; margin-bottom: 20px;
        }
        .nav-zone { width: 140px; display: flex; align-items: center; }
        .nav-zone-left { justify-content: flex-end; }
        .nav-zone-right { justify-content: flex-start; }
        .nav-center { display: flex; align-items: center; }
        .view-toggle::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100vw; height: 3px; background: rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3), 0 0 20px rgba(0, 255, 0, 0.2);
        }
        .view-toggle::after {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100vw; height: 3px; background: rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3), 0 0 20px rgba(0, 255, 0, 0.2);
        }
        .nav-arrow {
            background: transparent; border: none; color: #0f0;
            font-size: 18px; padding: 8px 12px; cursor: pointer;
            transition: all 0.3s; opacity: 0.8; text-decoration: none !important;
        }
        .nav-arrow:hover:not(:disabled) { opacity: 1; text-shadow: 0 0 10px rgba(0, 255, 0, 0.8); }
        .nav-arrow:disabled { color: rgba(0, 255, 0, 0.2); cursor: not-allowed; opacity: 0.3; }
        .nav-arrow.hidden { visibility: hidden; }
        a.nav-arrow { text-decoration: none !important; }
        .nav-info { font-size: 11px; color: rgba(0, 255, 0, 0.6); padding: 0 8px; white-space: nowrap; }
        .nav-separator { color: rgba(0, 255, 0, 0.4); font-size: 20px; font-weight: 300; padding: 0 15px; user-select: none; }

        /* time toggle removed */

        /* 3D Sector Carousel */
        .carousel-3d-container {
            perspective: 1000px; height: 100px; position: relative;
            margin: 15px 0 25px 0; width: 100%; max-width: 800px;
        }
        .carousel-3d {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
        }
        .carousel-3d .sector-item {
            position: absolute; width: 120px; height: 70px;
            left: 50%; top: 50%; margin-left: -60px; margin-top: -35px;
            background: rgba(0, 30, 0, 0.9); border: 1px solid rgba(0, 255, 0, 0.4);
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; flex-direction: column; color: #0f0;
            font-size: 13px; cursor: pointer; transition: all 0.5s ease;
            backface-visibility: hidden; user-select: none;
        }
        .carousel-3d .sector-item .sector-icon { font-size: 20px; margin-bottom: 4px; }
        .carousel-3d .sector-item .sector-label { font-size: 11px; text-align: center; padding: 0 5px; }
        .carousel-3d .sector-item.center {
            transform: translateZ(100px) scale(1.15);
            border-color: #0f0; box-shadow: 0 0 25px rgba(0, 255, 0, 0.5);
            z-index: 10; cursor: default;
        }
        .carousel-3d .sector-item.left {
            transform: translateX(-140px) translateZ(10px) rotateY(25deg) scale(0.95); opacity: 0.85;
        }
        .carousel-3d .sector-item.left:hover {
            transform: translateX(-135px) translateZ(20px) rotateY(25deg) scale(0.98);
            border-color: #0f0; box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        .carousel-3d .sector-item.right {
            transform: translateX(140px) translateZ(10px) rotateY(-25deg) scale(0.95); opacity: 0.85;
        }
        .carousel-3d .sector-item.right:hover {
            transform: translateX(135px) translateZ(20px) rotateY(-25deg) scale(0.98);
            border-color: #0f0; box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        .carousel-3d .sector-item.far-left {
            transform: translateX(-250px) translateZ(-60px) rotateY(40deg) scale(0.75); opacity: 0.5;
        }
        .carousel-3d .sector-item.far-right {
            transform: translateX(250px) translateZ(-60px) rotateY(-40deg) scale(0.75); opacity: 0.5;
        }
        .carousel-3d .sector-item.hidden {
            transform: translateX(0) translateZ(-150px) scale(0.5); opacity: 0; pointer-events: none;
        }
        @media (max-width: 700px) {
            .carousel-3d-container { height: 90px; transform: scale(0.85); margin: 10px 0 20px 0; }
            .carousel-3d .sector-item { width: 100px; height: 60px; margin-left: -50px; margin-top: -30px; }
            .carousel-3d .sector-item .sector-icon { font-size: 16px; }
            .carousel-3d .sector-item .sector-label { font-size: 10px; }
            .carousel-3d .sector-item.left { transform: translateX(-110px) translateZ(10px) rotateY(25deg) scale(0.9); }
            .carousel-3d .sector-item.right { transform: translateX(110px) translateZ(10px) rotateY(-25deg) scale(0.9); }
            .carousel-3d .sector-item.far-left { transform: translateX(-190px) translateZ(-60px) rotateY(40deg) scale(0.7); }
            .carousel-3d .sector-item.far-right { transform: translateX(190px) translateZ(-60px) rotateY(-40deg) scale(0.7); }
            .timing-row-below { gap: 6px; flex-wrap: wrap; }
            .timing-row-below .timing-filter-btn { padding: 4px 16px; font-size: 11px; }
            .vol-slider { width: 60px; }
            .vol-slider-label { font-size: 10px; }
            .vol-slider-val { font-size: 10px; min-width: 30px; }
            .nav-separator { padding: 0 8px; font-size: 16px; }
        }

        /* Summary Stats */
        .summary-stats {
            display: flex; flex-direction: row; flex-wrap: wrap;
            gap: 10px; margin-bottom: 25px; justify-content: center;
        }
        .summary-row { display: contents; }
        .summary-stat {
            background: rgba(20, 20, 35, 0.9); border: 1px solid rgba(100, 100, 150, 0.3);
            border-radius: 8px; padding: 12px 20px; text-align: center;
            min-width: 90px; cursor: pointer; transition: all 0.3s ease;
        }
        .summary-stat:hover { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .summary-stat.active { border-color: #0f0; box-shadow: 0 0 15px rgba(0, 255, 0, 0.4); background: rgba(0, 40, 0, 0.9); }
        @media (max-width: 700px) {
            .summary-stats { flex-direction: column; align-items: center; }
            .summary-row { display: flex; gap: 10px; justify-content: center; }
            .summary-stat { min-width: 80px; padding: 10px 15px; }
        }
        .summary-stat-value {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 24px; font-weight: 700; color: #e8e8e8;
        }
        .summary-stat-value.unusual { color: #a855f7; text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
        .summary-stat-value.normal { color: #64748b; text-shadow: 0 0 10px rgba(100, 116, 139, 0.3); }
        .summary-stat-value.bullish { color: #0f0; text-shadow: 0 0 10px rgba(0, 255, 0, 0.5); }
        .summary-stat-value.neutral { color: #d4a574; text-shadow: 0 0 10px rgba(212, 165, 116, 0.5); }
        .summary-stat-value.bearish { color: #f00; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
        .summary-stat-label {
            font-size: 10px; color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase; letter-spacing: 1px; margin-top: 5px;
        }

        /* Chart Modal */
        .chart-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 10000;
            justify-content: center; align-items: center;
        }
        .chart-modal.active { display: flex; }
        .chart-modal-content {
            background: rgba(0, 15, 0, 0.95); border: 1px solid rgba(0, 255, 0, 0.5);
            border-radius: 8px; padding: 20px; width: 90%; max-width: 500px;
            max-height: 95vh; overflow-y: auto; position: relative;
        }
        .chart-modal-header {
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 15px; padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.3); position: relative;
        }
        .chart-modal-title-wrapper { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .chart-modal-title {
            font-family: 'Orbitron', monospace; color: #0f0; font-size: 1rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .chart-modal-subtitle {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff; font-size: 0.8rem; margin-top: 2px;
        }
        .chart-modal-body { display: flex; flex-direction: column; gap: 15px; }
        .chart-section { display: flex; flex-direction: column; }
        .chart-section-label {
            text-align: center; font-size: 0.65rem; color: rgba(0, 255, 0, 0.6);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px;
        }
        .chart-canvas-wrapper { height: 140px; position: relative; }
        .chart-canvas-wrapper canvas { pointer-events: none; }
        .chart-modal-footer {
            display: flex; justify-content: center; align-items: center;
            margin-top: 15px; padding-top: 15px;
            border-top: 1px solid rgba(0, 255, 0, 0.3);
        }
        .chart-nav-btn {
            background: rgba(0, 20, 0, 0.8); border: 1px solid rgba(0, 255, 0, 0.5);
            border-radius: 4px; color: #0f0; font-size: 18px;
            cursor: pointer; padding: 6px 14px; transition: all 0.3s;
            position: absolute; top: 15px; z-index: 10;
        }
        .chart-nav-btn.nav-left { left: 15px; }
        .chart-nav-btn.nav-right { right: 15px; }
        .chart-nav-btn:hover { background: rgba(0, 30, 0, 0.9); border-color: #0f0; box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); }
        @media (max-width: 600px) {
            .chart-modal-content { width: 95%; padding: 15px; }
            .chart-canvas-wrapper { height: 120px; }
            .chart-nav-btn { display: none; }
        }

        /* Tab Content */
        .tab-content { width: 100%; max-width: 1400px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* Activity Grid */
        .activity-grid {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 20px; width: 100%; max-width: 1400px;
            margin: 0 auto; padding: 0 20px;
        }

        /* Activity Card */
        .activity-card {
            background: rgba(0, 15, 0, 0.85); border: 1px solid rgba(0, 255, 0, 0.4);
            border-radius: 8px; padding: 20px; transition: all 0.3s;
            position: relative; width: 320px; box-sizing: border-box;
        }
        .activity-card:hover { border-color: #0f0; box-shadow: 0 0 20px rgba(0, 255, 0, 0.3); }
        .activity-card.unusual { border-color: #0f0; box-shadow: 0 0 15px rgba(0, 255, 0, 0.2); }
        .activity-card.unusual:hover { box-shadow: 0 0 25px rgba(0, 255, 0, 0.4); }

        /* Card Zones */
        .card-header-zone {
            cursor: pointer; transition: background 0.2s;
            margin: -20px -20px 0 -20px; padding: 13px 20px 10px 20px;
            border-radius: 8px 8px 0 0;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-header-zone:hover { background: rgba(0, 255, 0, 0.15); }
        }
        .card-metrics-zone {
            cursor: pointer; transition: background 0.2s;
            margin: 0 -20px; padding: 0 20px;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-metrics-zone:hover { background: rgba(0, 255, 0, 0.15); }
        }
        .insights-wrapper {
            cursor: pointer; transition: background 0.2s;
            margin: 0 -20px -20px -20px; padding: 0 20px 20px 20px;
            border-radius: 0 0 8px 8px;
            touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) and (pointer: fine) {
            .insights-wrapper:hover { background: rgba(0, 255, 0, 0.15); }
        }

        /* Card Actions */
        .card-actions {
            position: absolute; top: 10px; right: 10px;
            display: flex; gap: 6px; opacity: 0; transition: opacity 0.3s;
        }
        @media (hover: hover) and (pointer: fine) {
            .activity-card:hover .card-actions { opacity: 1; }
        }
        .card-info {
            width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid rgba(0, 255, 0, 0.3); border-radius: 3px;
            color: rgba(0, 255, 0, 0.6); font-size: 12px; cursor: help;
            transition: all 0.3s; position: relative;
        }
        .card-info:hover { background: rgba(0, 255, 0, 0.1); border-color: #0f0; color: #0f0; }
        .card-info:hover::after {
            content: attr(data-tip); position: absolute; top: 100%; right: 0;
            margin-top: 8px; width: 260px; padding: 12px;
            background: rgba(0, 20, 0, 0.95); border: 1px solid rgba(0, 255, 0, 0.5);
            border-radius: 4px; color: #0f0; font-size: 11px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5; white-space: pre-line; z-index: 1000;
            box-shadow: 0 4px 12px rgba(0, 255, 0, 0.2);
        }
        .card-remove {

        let currentTab = 'all';
        let currentFilter = 'tickers';
        let currentTimingFilter = null;
        let currentMinOV = 0;
        let currentMinDV = 0;
        let carouselGroups = [];
        let carouselCurrentIndex = 0;

        // Calendar state
        let calMonth = new Date().getMonth();
        let calYear = new Date().getFullYear();
        let calendarEntries = [];
        const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const dayNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];

        function init() {
            const data = EARNINGS_DATA;
            if (!data || !data.all || data.all.length === 0) {
                document.getElementById('tabPanels').innerHTML = '<div style="text-align:center;padding:60px 20px;color:rgba(255,255,255,0.5);">No earnings data available for this date.</div>';
                return;
            }

            // Last updated timestamp is now per-tab (set in renderAllTabs)

            allSectors = ['All', ...data.groups];
            carouselGroups = allSectors;

            renderSectorCarousel();
            renderAllTabs(data);
            switchTab('All');

            // Show trading data subline if trade_date != target_date
            initTradeDataSubline(data);

            // Dispatch tabsRendered event for mobile enhancements
            document.dispatchEvent(new Event('tabsRendered'));
        }

        function initTradeDataSubline(data) {
            const sublineText = document.getElementById('tradeDataText');
            if (!sublineText || !data.trade_date) return;
            const tradeStr = data.trade_date.substring(0, 10);
            if (!tradeStr) return;
            const td = new Date(tradeStr + 'T12:00:00');
            const formatted = (td.getMonth()+1) + '/' + td.getDate() + '/' + td.getFullYear();
            sublineText.textContent = '(Trading data from ' + formatted + ')';
        }

        function renderSectorCarousel() {
            const container = document.getElementById('carousel3d');
            container.innerHTML = '';

            allSectors.forEach((sector, i) => {
                const item = document.createElement('div');
                item.className = 'sector-item hidden';
                item.dataset.index = i;
                item.dataset.group = sector;
                item.onclick = () => selectCarouselSector(i);

                const icon = sector === 'All' ? '&#x1F4CA;' : (SECTOR_ICONS[sector] || '&#x1F4CA;');
                const label = sector === 'All' ? 'All' : sector;

                item.innerHTML = `<div class="sector-icon">${icon}</div><div class="sector-label">${label}</div>`;
                container.appendChild(item);
            });

            updateCarouselPositions();
        }

        function selectCarouselSector(index) {
            currentSectorIndex = index;
            carouselCurrentIndex = index;
            updateCarouselPositions();
            switchTab(allSectors[index]);
        }

        function updateCarouselPositions() {
            const items = document.querySelectorAll('.sector-item');
            const total = items.length;
            if (total === 0) return;
            items.forEach((item, i) => {
                item.className = 'sector-item';
                let offset = i - currentSectorIndex;
                // Circular wrapping: find shortest distance
                if (offset > total / 2) offset -= total;
                if (offset < -total / 2) offset += total;
                if (offset === 0) item.classList.add('center');
                else if (offset === -1) item.classList.add('left');
                else if (offset === 1) item.classList.add('right');
                else if (offset === -2) item.classList.add('far-left');
                else if (offset === 2) item.classList.add('far-right');
                else item.classList.add('hidden');
            });
        }

        function renderAllTabs(data) {
            const container = document.getElementById('tabPanels');
            container.innerHTML = '';
            const timeStr = new Date(data.generated_at).toLocaleString('en-US', {month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'});

            allSectors.forEach(sector => {
                const tabId = sector.toLowerCase().replace(/ /g, '_');
                const items = sector === 'All' ? data.all : (data[tabId] || []);

                const panel = document.createElement('div');
                panel.className = 'tab-panel';
                panel.id = `tab-${tabId}`;

                const unusual = items.filter(i => i.activity === 'UNUSUAL').length;
                const normal = items.filter(i => i.activity === 'NORMAL').length;
                const bullish = items.filter(i => i.sentiment === 'BULLISH').length;
                const bearish = items.filter(i => i.sentiment === 'BEARISH').length;
                const neumix = items.filter(i => i.sentiment === 'NEUTRAL' || i.sentiment === 'MIXED').length;

                panel.innerHTML = `
                    <div class="summary-stats" id="${tabId}-summary">
                        <div class="summary-row">
                            <div class="summary-stat" onclick="filterCards('${tabId}', 'tickers', this)">
                                <div class="summary-stat-value">${items.length}</div>
                                <div class="summary-stat-label">Tickers</div>
                            </div>
                            <div class="summary-stat" onclick="filterCards('${tabId}', 'unusual', this)">
                                <div class="summary-stat-value unusual">${unusual}</div>
                                <div class="summary-stat-label">Unusual</div>
                            </div>
                            <div class="summary-stat" onclick="filterCards('${tabId}', 'normal', this)">
                                <div class="summary-stat-value normal">${normal}</div>
                                <div class="summary-stat-label">Normal</div>
                            </div>
                        </div>
                        <div class="summary-row">
                            <div class="summary-stat" onclick="filterCards('${tabId}', 'bullish', this)">
                                <div class="summary-stat-value bullish">${bullish}</div>
                                <div class="summary-stat-label">Bullish</div>
                            </div>
                            <div class="summary-stat" onclick="filterCards('${tabId}', 'neumix', this)">
                                <div class="summary-stat-value neutral">${neumix}</div>
                                <div class="summary-stat-label">Neu/Mix</div>
                            </div>
                            <div class="summary-stat" onclick="filterCards('${tabId}', 'bearish', this)">
                                <div class="summary-stat-value bearish">${bearish}</div>
                                <div class="summary-stat-label">Bearish</div>
                            </div>
                        </div>
                    </div>
                    <div class="activity-grid" id="${tabId}-grid">
                        ${items.map(item => renderCard(item)).join('')}
                    </div>
                    <div class="last-updated" id="${tabId}-last-updated">Last updated: ${timeStr}</div>
                `;

                container.appendChild(panel);
            });
        }

        function renderCard(item) {
            const cardClass = item.is_unusual ? 'unusual' : '';
            const badgeClass = item.is_unusual ? 'unusual' : 'normal';
            const badgeText = item.is_unusual ? 'UNUSUAL' : 'NORMAL';

            // Weighted sentiment
            let sentimentClass = 'neutral';
            let sentimentText = 'NEUTRAL';
            let bullishScore = 0, bearishScore = 0;
            if (item.dv_call_pct >= 60) bullishScore += 2;
            else if (item.dv_put_pct >= 60) bearishScore += 2;
            if (item.vol_call_pct >= 60) bullishScore += 1;
            else if (item.vol_put_pct >= 60) bearishScore += 1;
            if (item.put_call_volume_ratio < 0.7) bullishScore += 1;
            else if (item.put_call_volume_ratio > 1.0) bearishScore += 1;
            if (bullishScore > bearishScore) { sentimentClass = 'bullish'; sentimentText = 'BULLISH'; }
            else if (bearishScore > bullishScore) { sentimentClass = 'bearish'; sentimentText = 'BEARISH'; }
            else if (bullishScore > 0 && bearishScore > 0) { sentimentClass = 'mixed'; sentimentText = 'MIXED'; }

            const priceChangeClass = item.price_change_pct >= 0 ? 'positive' : 'negative';
            const priceChangeSign = item.price_change_pct >= 0 ? '+' : '';
            const volRatioClass = item.option_volume_ratio >= 2 ? 'high' : 'normal';
            const dollarRatioClass = item.dollar_volume_option_ratio >= 2 ? 'high' : 'normal';
            const earningsTimeClass = (item.earnings_time || 'tas').toLowerCase();
            const earningsTimeLabel = item.earnings_time === 'AMC' ? 'AMC' : (item.earnings_time === 'BMO' ? 'BMO' : '');

            const infoTip = "OPTION VOLUME:&#10;Contracts traded vs 7-day avg. 2x+ = unusual.&#10;&#10;DOLLAR VOLUME:&#10;Premium traded (institutional flow). 2x+ = unusual.&#10;&#10;PUT/CALL RATIO:&#10;Below 0.7 = bullish, above 1.0 = bearish.&#10;&#10;EARNINGS:&#10;AMC = After Market Close today&#10;BMO = Before Market Open tomorrow";

            const activityBadge = `<span class="status-badge ${badgeClass}">${badgeText}</span>`;
            const sentimentBadge = `<span class="status-badge ${sentimentClass}">${sentimentText}</span>`;

            return `
                <div class="activity-card ${cardClass}" data-sentiment="${sentimentText}" data-activity="${badgeText}" data-earnings-time="${item.earnings_time}" data-ov="${item.option_volume || 0}" data-dv="${item.dollar_volume_option || 0}">
                    <div class="card-actions">
                        <span class="card-info" data-tip="${infoTip}">&#8505;</span>
                        <button class="card-remove" onclick="event.stopPropagation(); removeTicker('${item.ticker}')" title="Hide ${item.ticker}">&times;</button>
                    </div>
                    <!-- RED ZONE: Header - navigates to ticker page -->
                    <div class="card-header-zone" onclick="navigateToTicker('${item.ticker}')">
                        <div class="card-header">
                            <div class="ticker-info">
                                <h3>${item.ticker}${earningsTimeLabel ? ` <span class="earnings-badge ${earningsTimeClass}">${earningsTimeLabel}</span>` : ''}</h3>
                                ${item.company_name ? `<div class="company-name" title="${item.company_name}">${item.company_name}</div>` : ''}
                                <div class="ticker-price">
                                    $${item.price.toFixed(2)}
                                    <span class="ticker-change ${priceChangeClass}">
                                        ${priceChangeSign}${item.price_change_pct.toFixed(2)}%
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BLUE ZONE: Metrics - shows chart popup -->
                    <div class="card-metrics-zone" onclick="showTickerChart('${item.ticker}', ${JSON.stringify(item).replace(/"/g, '&quot;')})">
                        <div class="metrics-section">
                            <div class="metric-row">
                                <span class="metric-label">Option Volume</span>
                                <span class="metric-value">
                                    ${item.option_volume_ratio >= 2 ? (item.vol_put_pct >= 60 ? '<span class="arrow-down">&#9660;</span>' : (item.vol_call_pct >= 60 ? '<span class="arrow-up">&#9650;</span>' : '')) : ''}${formatNumber(item.option_volume)}
                                    <span class="metric-ratio ${volRatioClass}">(${item.option_volume_ratio}x)</span>
                                </span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">Dollar Volume</span>
                                <span class="metric-value">
                                    ${item.dollar_volume_option_ratio >= 2 ? (item.dv_put_pct >= 60 ? '<span class="arrow-down">&#9660;</span>' : (item.dv_call_pct >= 60 ? '<span class="arrow-up">&#9650;</span>' : '')) : ''}$${formatNumber(item.dollar_volume_option)}
                                    <span class="metric-ratio ${dollarRatioClass}">(${item.dollar_volume_option_ratio}x)</span>
                                </span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">Put/Call Ratio</span>
                                <span class="metric-value">${item.put_call_volume_ratio < 0.7 ? '<span class="arrow-up">&#9650;</span>' : (item.put_call_volume_ratio > 1.0 ? '<span class="arrow-down">&#9660;</span>' : '')}<span class="${(item.put_call_volume_ratio < 0.7 || item.put_call_volume_ratio > 1.0) ? 'pc-unusual' : ''}">${item.put_call_volume_ratio.toFixed(2)}</span></span>
                            </div>
                        </div>
                        <div class="call-put-section">
                            <div class="bar-row">
                                <span class="bar-row-label">Opt Vol</span>
                                <span class="bar-val-left">${item.vol_call_pct != null ? item.vol_call_pct : 50}%</span>
                                <div class="bar-container">
                                    <div class="bar-calls" style="width: ${item.vol_call_pct != null ? item.vol_call_pct : 50}%"></div>
                                    <div class="bar-puts" style="width: ${item.vol_put_pct != null ? item.vol_put_pct : 50}%"></div>
                                </div>
                                <span class="bar-val-right">${item.vol_put_pct != null ? item.vol_put_pct : 50}%</span>
                            </div>
                            <div class="bar-row">
                                <span class="bar-row-label">$ Vol</span>
                                <span class="bar-val-left">${item.dv_call_pct != null ? item.dv_call_pct : 50}%</span>
                                <div class="bar-container">
                                    <div class="bar-calls" style="width: ${item.dv_call_pct != null ? item.dv_call_pct : 50}%"></div>
                                    <div class="bar-puts" style="width: ${item.dv_put_pct != null ? item.dv_put_pct : 50}%"></div>
                                </div>
                                <span class="bar-val-right">${item.dv_put_pct != null ? item.dv_put_pct : 50}%</span>
                            </div>
                            <div class="pc-gauge">
                                <span class="pc-gauge-label">P/C</span>
                                <span class="pc-val-left bullish">0</span>
                                <div class="pc-gauge-container">
                                    <div class="pc-zone-bullish"></div>
                                    <div class="pc-zone-neutral"></div>
                                    <div class="pc-zone-bearish"></div>
                                    <div class="pc-indicator" style="left: ${Math.min(item.put_call_volume_ratio / 2.0 * 100, 100)}%"></div>
                                </div>
                                <span class="pc-val-right bearish">2</span>
                            </div>
                        </div>
                    </div>

                    <!-- GREEN ZONE: Badges + AI Insights -->
                    <div class="insights-wrapper" onclick="toggleInsightsWrapper(event)">
                        <div class="status-badge-container layout-6">
                            ${activityBadge}${sentimentBadge}
                        </div>
                        <div class="ai-insights-content">
                            <div class="ai-insights-inner">
                                ${generateInsights(item)}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateInsights(item) {
            if (!item || item.option_volume <= 0) {
                return '<p>No options data available for analysis.</p>';
            }
            let insights = [];

            // Earnings timing insight
            if (item.earnings_time === 'AMC') {
                insights.push('<p><span class="highlight-earnings">EARNINGS AMC</span>: Reports after market close today. Watch for post-earnings volatility.</p>');
            } else if (item.earnings_time === 'BMO') {
                insights.push('<p><span class="highlight-earnings">EARNINGS BMO</span>: Reports before market open tomorrow. Pre-earnings positioning in progress.</p>');
            }

            // Activity insight
            if (item.is_unusual) {
                let reasons = [];
                if (item.option_volume_ratio >= 2) reasons.push(`option volume is <span class="highlight-unusual">${item.option_volume_ratio}x</span> the 7-day average`);
                if (item.dollar_volume_option_ratio >= 2) reasons.push(`dollar volume is <span class="highlight-unusual">${item.dollar_volume_option_ratio}x</span> the 7-day average`);
                if (item.put_call_volume_ratio < 0.5) reasons.push(`P/C ratio of ${item.put_call_volume_ratio.toFixed(2)} is extremely bullish`);
                else if (item.put_call_volume_ratio > 2.0) reasons.push(`P/C ratio of ${item.put_call_volume_ratio.toFixed(2)} is extremely bearish`);
                if (reasons.length > 0) {
                    insights.push(`<p><span class="highlight-unusual">UNUSUAL</span> activity detected: ${reasons.join(', ')}.</p>`);
                } else {
                    insights.push('<p><span class="highlight-unusual">UNUSUAL</span> activity detected based on options flow patterns.</p>');
                }
            } else {
                insights.push('<p><span class="highlight-normal">NORMAL</span> activity: Volume and flow metrics are within typical ranges.</p>');
            }

            // Sentiment insight
            const pcRatio = item.put_call_volume_ratio;
            const dvCallPct = item.dv_call_pct != null ? item.dv_call_pct : 50;
            const dvPutPct = item.dv_put_pct != null ? item.dv_put_pct : 50;
            const volCallPct = item.vol_call_pct != null ? item.vol_call_pct : 50;
            const volPutPct = item.vol_put_pct != null ? item.vol_put_pct : 50;
            let bullishSignals = [], bearishSignals = [];
            let bScore = 0, brScore = 0;
            if (dvCallPct >= 60) { bullishSignals.push(`dollar volume has ${dvCallPct}% calls`); bScore += 2; }
            else if (dvPutPct >= 60) { bearishSignals.push(`dollar volume has ${dvPutPct}% puts`); brScore += 2; }
            if (volCallPct >= 60) { bullishSignals.push(`option volume has ${volCallPct}% calls`); bScore += 1; }
            else if (volPutPct >= 60) { bearishSignals.push(`option volume has ${volPutPct}% puts`); brScore += 1; }
            if (pcRatio < 0.7) { bullishSignals.push(`P/C ratio is ${pcRatio.toFixed(2)}`); bScore += 1; }
            else if (pcRatio > 1.0) { bearishSignals.push(`P/C ratio is ${pcRatio.toFixed(2)}`); brScore += 1; }

            if (bScore > brScore) insights.push(`<p><span class="highlight-bullish">BULLISH</span> sentiment: ${bullishSignals.join(', ')}.</p>`);
            else if (brScore > bScore) insights.push(`<p><span class="highlight-bearish">BEARISH</span> sentiment: ${bearishSignals.join(', ')}.</p>`);
            else if (bScore > 0 && brScore > 0) insights.push(`<p><span class="highlight-mixed">MIXED</span> sentiment: ${bullishSignals.join(', ')} (bullish) vs ${bearishSignals.join(', ')} (bearish).</p>`);
            else insights.push(`<p><span class="highlight-neutral">NEUTRAL</span> sentiment: Balanced flow with ${volCallPct}% calls, P/C ratio ${pcRatio.toFixed(2)}.</p>`);

            return insights.join('');
        }

        function switchTab(sector) {
            currentTab = sector;
            currentFilter = 'tickers';
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            const tabId = sector.toLowerCase().replace(/ /g, '_');
            const panel = document.getElementById(`tab-${tabId}`);
            if (panel) panel.classList.add('active');
        }

        function applyAllFilters() {
            // Apply both sentiment/activity filter AND timing filter to all visible tabs
            document.querySelectorAll('.tab-panel').forEach(panel => {
                const grid = panel.querySelector('.activity-grid');
                if (!grid) return;
                const cards = grid.querySelectorAll('.activity-card');
                cards.forEach(card => {
                    let showSentiment = true;
                    let showTiming = true;
                    // Sentiment/activity filter
                    if (currentFilter !== 'tickers') {
                        const sentiment = card.dataset.sentiment;
                        const activity = card.dataset.activity;
                        switch(currentFilter) {
                            case 'unusual': showSentiment = activity === 'UNUSUAL'; break;
                            case 'normal': showSentiment = activity === 'NORMAL'; break;
                            case 'bullish': showSentiment = sentiment === 'BULLISH'; break;
                            case 'bearish': showSentiment = sentiment === 'BEARISH'; break;
                            case 'neumix': showSentiment = sentiment === 'NEUTRAL' || sentiment === 'MIXED'; break;
                        }
                    }
                    // Timing filter (BMO/TNS/AMC)
                    if (currentTimingFilter) {
                        const timing = card.dataset.earningsTime;
                        if (currentTimingFilter === 'TNS') {
                            showTiming = timing !== 'BMO' && timing !== 'AMC';
                        } else {
                            showTiming = timing === currentTimingFilter;
                        }
                    }
                    // Volume filters (OV / $V sliders)
                    let showVolume = true;
                    if (currentMinOV > 0 && (parseFloat(card.dataset.ov) || 0) < currentMinOV) showVolume = false;
                    if (currentMinDV > 0 && (parseFloat(card.dataset.dv) || 0) < currentMinDV) showVolume = false;
                    card.style.display = (showSentiment && showTiming && showVolume) ? '' : 'none';
                });
                // Update summary-stat counts based on visible cards
                updateSummaryCounts(panel, cards);
            });
        }

        function updateSummaryCounts(panel, cards) {
            const visible = Array.from(cards).filter(c => c.style.display !== 'none');
            const counts = {
                tickers: visible.length,
                unusual: visible.filter(c => c.dataset.activity === 'UNUSUAL').length,
                normal: visible.filter(c => c.dataset.activity === 'NORMAL').length,
                bullish: visible.filter(c => c.dataset.sentiment === 'BULLISH').length,
                bearish: visible.filter(c => c.dataset.sentiment === 'BEARISH').length,
                neumix: visible.filter(c => c.dataset.sentiment === 'NEUTRAL' || c.dataset.sentiment === 'MIXED').length
            };
            const summary = panel.querySelector('.summary-stats');
            if (!summary) return;
            const stats = summary.querySelectorAll('.summary-stat');
            const order = ['tickers', 'unusual', 'normal', 'bullish', 'neumix', 'bearish'];
            stats.forEach((stat, i) => {
                const val = stat.querySelector('.summary-stat-value');
                if (val && order[i] !== undefined) val.textContent = counts[order[i]];
            });
        }

        function filterCards(tabId, filterType, clickedBtn) {
            const grid = document.getElementById(tabId + '-grid');
            if (!grid) return;
            const summary = document.getElementById(tabId + '-summary');
            const stats = summary ? summary.querySelectorAll('.summary-stat') : [];

            stats.forEach(s => s.classList.remove('active'));
            currentFilter = filterType;
            if (clickedBtn && filterType !== 'tickers') clickedBtn.classList.add('active');
            applyAllFilters();
        }

        function toggleTimingFilter(timing) {
            const bmoBtn = document.getElementById('bmoFilterBtn');
            const tnsBtn = document.getElementById('tnsFilterBtn');
            const amcBtn = document.getElementById('amcFilterBtn');
            if (currentTimingFilter === timing) {
                currentTimingFilter = null;
                bmoBtn.classList.remove('active');
                tnsBtn.classList.remove('active');
                amcBtn.classList.remove('active');
            } else {
                currentTimingFilter = timing;
                bmoBtn.classList.toggle('active', timing === 'BMO');
                tnsBtn.classList.toggle('active', timing === 'TNS');
                amcBtn.classList.toggle('active', timing === 'AMC');
            }
            applyAllFilters();
        }

        function updateVolFilter() {
            const ovSlider = document.getElementById('ovSlider');
            const dvSlider = document.getElementById('dvSlider');
            currentMinOV = parseInt(ovSlider.value) || 0;
            currentMinDV = parseInt(dvSlider.value) || 0;
            const fmtNum = (n) => { if (n >= 1e6) return '$' + (n/1e6).toFixed(1)+'M'; if (n >= 1e3) return '$' + (n/1e3).toFixed(0)+'K'; return '$' + n; };
            document.getElementById('ovSliderVal').textContent = currentMinOV > 0 ? currentMinOV.toLocaleString() : '0';
            document.getElementById('dvSliderVal').textContent = currentMinDV > 0 ? fmtNum(currentMinDV) : '$0';
            applyAllFilters();
        }

        function toggleInsightsWrapper(event) {
            event.stopPropagation();
            const wrapper = event.currentTarget;
            const content = wrapper.querySelector('.ai-insights-content');
            // Collapse all other expanded cards first (accordion)
            document.querySelectorAll('.ai-insights-content.expanded').forEach(el => {
                if (el !== content) {
                    el.classList.remove('expanded');
                    el.closest('.insights-wrapper').querySelector('.status-badge-container').classList.remove('expanded');
                }
            });
            wrapper.querySelector('.status-badge-container').classList.toggle('expanded');
            content.classList.toggle('expanded');
        }

        // ========== CHART MODAL ==========
        function showTickerChart(ticker, item) {
            if (typeof item === 'string') item = JSON.parse(item.replace(/&quot;/g, '"'));

            let modal = document.getElementById('tickerChartModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'tickerChartModal';
                modal.className = 'chart-modal';
                modal.innerHTML = `
                    <div class="chart-modal-content">
                        <button class="chart-nav-btn nav-left" onclick="navigateTicker(-1)">&#9664;</button>
                        <button class="chart-nav-btn nav-right" onclick="navigateTicker(1)">&#9654;</button>
                        <div class="chart-modal-header">
                            <div class="chart-modal-title-wrapper">
                                <span class="chart-modal-title" id="tickerChartTitle">EARNINGS</span>
                                <span class="chart-modal-subtitle" id="tickerChartSubtitle">7-Day Metrics History</span>
                            </div>
                        </div>
                        <div class="chart-modal-body">
                            <div class="chart-section">
                                <div class="chart-section-label" id="chartLabelVolRatio">7-Day Volume Ratios</div>
                                <div class="chart-canvas-wrapper"><canvas id="tickerVolumeChart"></canvas></div>
                            </div>
                            <div class="chart-section">
                                <div class="chart-section-label" id="chartLabelOptVol">7-Day Option Volume (Calls vs Puts)</div>
                                <div class="chart-canvas-wrapper"><canvas id="tickerCallPutVolChart"></canvas></div>
                            </div>
                            <div class="chart-section">
                                <div class="chart-section-label" id="chartLabelDolVol">7-Day Dollar Volume (Calls vs Puts)</div>
                                <div class="chart-canvas-wrapper"><canvas id="tickerCallPutDvChart"></canvas></div>
                            </div>

        function buildTicker7DayData(ticker, currentItem) {
            const dates = [], optionVolumeRatio = [], dollarVolumeRatio = [], putCallRatio = [];
            const callVolume = [], putVolume = [], callDollarVolume = [], putDollarVolume = [];
            const safeNum = (v, fallback) => (v != null && v !== '') ? v : fallback;
            if (typeof TICKER_HISTORY_DATA !== 'undefined' && TICKER_HISTORY_DATA.length > 0) {
                const recent = TICKER_HISTORY_DATA.slice(-7);
                recent.forEach(entry => {
                    const td = entry.tickers ? entry.tickers[ticker] : null;
                    if (td) {
                        const d = entry.trade_date;
                        dates.push(`${parseInt(d.substring(5,7))}/${parseInt(d.substring(8,10))}`);
                        optionVolumeRatio.push(safeNum(td.option_volume_ratio, 0));
                        dollarVolumeRatio.push(safeNum(td.dollar_volume_option_ratio, 0));
                        putCallRatio.push(safeNum(td.put_call_volume_ratio, 0));
                        callVolume.push(safeNum(td.call_volume, 0));
                        putVolume.push(safeNum(td.put_volume, 0));
                        callDollarVolume.push(safeNum(td.call_dollar_volume, 0));
                        putDollarVolume.push(safeNum(td.put_dollar_volume, 0));
                    }
                });
            }
            // Always add today's current data as the last bar
            const now = new Date();
            const todayLabel = `${now.getMonth()+1}/${now.getDate()}`;
            // Avoid duplicate if history already has today
            if (dates.length === 0 || dates[dates.length - 1] !== todayLabel) {
                const optVol = currentItem.option_volume || 0;
                const cvol = Math.round(optVol * (currentItem.vol_call_pct || 0) / 100);
                const pvol = Math.round(optVol * (currentItem.vol_put_pct || 0) / 100);
                dates.push(todayLabel);
                optionVolumeRatio.push(safeNum(currentItem.option_volume_ratio, 0));
                dollarVolumeRatio.push(safeNum(currentItem.dollar_volume_option_ratio, 0));
                putCallRatio.push(safeNum(currentItem.put_call_volume_ratio, 0));
                callVolume.push(cvol);
                putVolume.push(pvol);
                callDollarVolume.push(safeNum(currentItem.dollar_volume_call, 0));
                putDollarVolume.push(safeNum(currentItem.dollar_volume_put, 0));
            }
            return { dates, optionVolumeRatio, dollarVolumeRatio, putCallRatio, callVolume, putVolume, callDollarVolume, putDollarVolume };
        }

            let ni = currentTickerIndex + direction;
            if (ni < 0) ni = currentTickerList.length - 1;
            if (ni >= currentTickerList.length) ni = 0;
            currentTickerIndex = ni;
            showTickerChart(currentTickerList[ni].ticker, currentTickerList[ni].item);

        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            return num.toString();

        // ========== DATE PICKER ==========
        function getCurrentDate() {
            if (EARNINGS_DATA && EARNINGS_DATA.target_date) return EARNINGS_DATA.target_date;
            return new Date().toISOString().split('T')[0];
        }

        function isTradingDay(dateStr) {
            const date = new Date(dateStr + 'T12:00:00');
            const day = date.getDay();
            return day !== 0 && day !== 6;
        }

        let datePickerOpenedAt = 0;
        let datePickerLastToggle = 0;
        function toggleDatePicker(event) {
            event.stopPropagation();
            event.preventDefault();
            const now = Date.now();
            if (now - datePickerLastToggle < 300) return;
            datePickerLastToggle = now;

            const dropdown = document.getElementById('datePickerDropdown');
            const backdrop = document.getElementById('datePickerBackdrop');
            const isActive = dropdown.classList.contains('active');

            if (isActive) {
                dropdown.classList.remove('active');
                backdrop.classList.remove('active');
            } else {
                const cd = getCurrentDate();
                const d = new Date(cd + 'T12:00:00');
                calMonth = d.getMonth();
                calYear = d.getFullYear();
                renderCalendar();
                backdrop.classList.add('active');
                dropdown.classList.add('active');
                datePickerOpenedAt = Date.now();
            }
            document.getElementById('datePickerMessage').className = 'date-picker-message';
            document.getElementById('datePickerMessage').textContent = '';
        }

        function closeDatePicker() {
            document.getElementById('datePickerDropdown').classList.remove('active');
            document.getElementById('datePickerBackdrop').classList.remove('active');
        }

        function changeCalendarMonth(delta, event) {
            event.stopPropagation();
            calMonth += delta;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            else if (calMonth < 0) { calMonth = 11; calYear--; }
            renderCalendar();
        }

        function hasArchiveData(dateStr) {
            return calendarEntries.some(entry => entry.trade_date === dateStr);
        }

        function renderCalendar() {
            document.getElementById('calMonthHeader').textContent = `${monthNames[calMonth]} ${calYear}`;
            document.getElementById('calPrevBtn').disabled = (calYear === 2024 && calMonth === 0);
            document.getElementById('calNextBtn').disabled = (calYear === 2027 && calMonth === 11);

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            dayNames.forEach(day => {
                const h = document.createElement('div');
                h.className = 'calendar-day-header'; h.textContent = day;
                grid.appendChild(h);
            });

            const firstDay = new Date(calYear, calMonth, 1);
            const lastDay = new Date(calYear, calMonth + 1, 0);
            const currentDate = getCurrentDate();

            for (let i = 0; i < firstDay.getDay(); i++) {
                const e = document.createElement('div');
                e.className = 'calendar-day empty'; grid.appendChild(e);
            }
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const dc = document.createElement('div');
                dc.className = 'calendar-day'; dc.textContent = day;
                const ds = `${calYear}-${(calMonth+1).toString().padStart(2,'0')}-${day.toString().padStart(2,'0')}`;
                const canTrade = isTradingDay(ds);
                const hasData = hasArchiveData(ds);
                const isSelected = ds === currentDate;

                if (!canTrade) { dc.classList.add('disabled'); }
                else {
                    if (hasData) dc.classList.add('has-data');
                    if (isSelected) dc.classList.add('selected');
                    dc.addEventListener('touchend', function(e) { e.preventDefault(); e.stopPropagation(); selectDate(ds); });
                    dc.addEventListener('click', function(e) { e.stopPropagation(); selectDate(ds); });
                }
                grid.appendChild(dc);
            }
        }

        function selectDate(dateStr) {
            const msg = document.getElementById('datePickerMessage');
            const matches = calendarEntries.filter(e => e.trade_date === dateStr);
            matches.sort((a, b) => b.filename.localeCompare(a.filename));
            const match = matches.length > 0 ? matches[0] : null;

            if (match) {
                const cp = window.location.pathname;
                const isLatest = cp.includes('_latest.html');
                let targetPath;
                if (isLatest) {
                    targetPath = match.path_from_screener;
                } else {
                    const cm = cp.match(/HTML\/(\d{6})\//)?.[1] || cp.match(/HTML\/(\d{6})\//)?.[1];
                    const tm = match.trade_date.replace(/-/g, '').substring(0, 6);
                    targetPath = (cm === tm) ? match.filename : `../${tm}/${match.filename}`;
                }
                if (currentTab) localStorage.setItem('earnings_selected_tab', currentTab);
                window.location.href = targetPath;
                return;
            }
            const dateObj = new Date(dateStr + 'T12:00:00');
            const label = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            msg.className = 'date-picker-message error';
            msg.textContent = `No data available for ${label}`;
        }

        function loadCalendarFromJSON() {
            // Priority 1: Global variable from script tag (works on file://)
            if (typeof window.EARNINGS_CALENDAR !== 'undefined' && window.EARNINGS_CALENDAR.entries) {
                calendarEntries = window.EARNINGS_CALENDAR.entries;
                renderCalendar();
                return;
            }

            // Priority 2: Try fetch for http:// (better caching)
            const isLatest = window.location.pathname.includes('_latest.html');
            const basePath = isLatest ? '' : '../../';
            const calUrl = basePath + 'earnings_DAILY_CALENDAR.json?t=' + Date.now();

            fetch(calUrl)
                .then(r => r.ok ? r.json() : Promise.reject('Not OK'))
                .then(data => {
                    calendarEntries = data.entries || [];
                    renderCalendar();
                })
                .catch(e => {
                    console.warn('Could not fetch earnings calendar JSON:', e);
                });
        }

        // ========== MATRIX RAIN ==========
        function initMatrixRain() {
            const canvas = document.getElementById('matrix-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const chars = '01';
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0f03';
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);
            window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        }

        // ========== SMART NAVIGATION ==========
        const SCREENER_NAV_ORDER = ['VIDEO', 'DATA', 'CHECKS'];
        const SCREENER_NAME = 'earnings';

        function getScreenerPagePaths(name, pageType, tf) {
            const TF = (tf || 'daily').toUpperCase();
            switch (pageType) {
                case 'VIDEO': return ['VIDEOS/index.html'];
                case 'DATA': return [`${name}_${TF}_latest.html`, `${name}_latest.html`];
                case 'CHECKS': return [`${name}_${TF}_checks.html`];
                default: return [];
            }
        }

        async function screenerFileExists(url) {
            try { return (await fetch(url, { method: 'HEAD' })).ok; } catch (e) { return false; }
        }

        async function findNextScreenerPage(name, currentType, tf) {
            const ci = SCREENER_NAV_ORDER.indexOf(currentType);
            for (let i = 1; i <= SCREENER_NAV_ORDER.length; i++) {
                const ni = (ci + i) % SCREENER_NAV_ORDER.length;
                const paths = getScreenerPagePaths(name, SCREENER_NAV_ORDER[ni], tf);
                for (const p of paths) { if (await screenerFileExists(p)) return { type: SCREENER_NAV_ORDER[ni], path: p }; }
            }
            return null;
        }

        async function initScreenerSmartNav() {
            const btn = document.getElementById('smartNavBtn');
            if (!btn) return;
            const tf = window.location.pathname.includes('INTRADAY') ? 'INTRADAY' : 'DAILY';
            const next = await findNextScreenerPage(SCREENER_NAME, 'DATA', tf);
            if (next) { btn.textContent = next.type; btn.href = next.path; btn.onclick = () => { window.location.href = next.path; return false; }; }
            else btn.style.display = 'none';
        }

        (function initMobileEnhancements() {
            function isMobileMode() {
                return window.innerWidth < 768 || (window.innerWidth < 1024 && window.innerHeight > window.innerWidth);
            }

            const TAB_KEY = 'earnings_selected_tab';
            const SCROLL_KEY = 'earnings_scroll_pos';

            function saveCurrentTab() { if (currentTab) localStorage.setItem(TAB_KEY, currentTab); }
            function restoreSavedTab() {
                const saved = localStorage.getItem(TAB_KEY);
                if (saved) {
                    // Find matching sector
                    const idx = allSectors.findIndex(s => s.toLowerCase().replace(/ /g, '_') === saved.toLowerCase().replace(/ /g, '_'));
                    if (idx >= 0) { selectCarouselSector(idx); }
                }
            }
            function saveScrollPosition() { sessionStorage.setItem(SCROLL_KEY, window.scrollY.toString()); }
            function restoreScrollPosition() {
                const saved = sessionStorage.getItem(SCROLL_KEY);
                if (saved) { setTimeout(() => { window.scrollTo(0, parseInt(saved, 10)); sessionStorage.removeItem(SCROLL_KEY); }, 100); }
            }

            function saveStateAndNavigate(url, saveScroll) {
                if (!url || url === '#') return;
                saveCurrentTab();
                if (saveScroll && isMobileMode()) saveScrollPosition();
                window.location.href = url;
            }

            function enhanceNavArrows() {
                const prev = document.getElementById('staticPrevBtn');
                const next = document.getElementById('staticNextBtn');
                if (prev && prev.href && prev.href !== '#') {
                    prev.addEventListener('click', (e) => { e.preventDefault(); saveStateAndNavigate(prev.href, isMobileMode()); });
                }
                if (next && next.href && next.href !== '#' && next.style.display !== 'none') {
                    next.addEventListener('click', (e) => { e.preventDefault(); saveStateAndNavigate(next.href, isMobileMode()); });
                }
            }

            function initCarouselSwipe() {
                const carousel = document.getElementById('sectorCarousel');
                if (!carousel) return;
                let startX = 0, startY = 0, isDragging = false, isHoriz = false;
                carousel.addEventListener('touchstart', (e) => { isDragging = true; isHoriz = false; startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
                carousel.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    if (Math.abs(e.touches[0].clientX - startX) > Math.abs(e.touches[0].clientY - startY) && Math.abs(e.touches[0].clientX - startX) > 10) { isHoriz = true; e.preventDefault(); }
                }, { passive: false });
                carousel.addEventListener('touchend', (e) => {
                    if (!isDragging || !isHoriz) { isDragging = false; return; }
                    isDragging = false;
                    const dx = e.changedTouches[0].clientX - startX;
                    if (Math.abs(dx) > 50) {
                        const total = carouselGroups.length;
                        if (total === 0) return;
                        selectCarouselSector(dx > 0 ? (carouselCurrentIndex - 1 + total) % total : (carouselCurrentIndex + 1) % total);
                    }
                }, { passive: true });
            }

            document.addEventListener('tabsRendered', () => {
                restoreSavedTab();
                if (isMobileMode()) restoreScrollPosition();
            }, { once: true });

            const origSwitch = window.switchTab;
            if (typeof origSwitch === 'function') {
                window.switchTab = function(tabId) { origSwitch(tabId); saveCurrentTab(); };
            }

            initCarouselSwipe();
            enhanceNavArrows();
        })();

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', () => {
            window.scrollTo(0, 0);
            initMatrixRain();
            init();
            loadCalendarFromJSON();

            // Date picker touch/click
            const tradeDateEl = document.getElementById('tradeDateText');
            let touchHandled = false;
            if (tradeDateEl) {
                tradeDateEl.addEventListener('touchend', function(e) {
                    e.preventDefault(); touchHandled = true; toggleDatePicker(e);
                    setTimeout(() => { touchHandled = false; }, 300);
                });
                tradeDateEl.addEventListener('click', function(e) { if (!touchHandled) toggleDatePicker(e); });
            }

            // Close date picker on outside click
            document.addEventListener('click', function(e) {
                if (Date.now() - datePickerOpenedAt < 300) return;
                if (!e.target.closest('.date-picker-container')) closeDatePicker();
            });

            const dpBackdrop = document.getElementById('datePickerBackdrop');
            if (dpBackdrop) {
                dpBackdrop.addEventListener('click', closeDatePicker);
                dpBackdrop.addEventListener('touchend', function(e) { e.preventDefault(); closeDatePicker(); });
            }

            document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDatePicker(); });
        });
    
        
        // ========== CI/CD CHECK SYSTEM ==========
        var cicdTitleSelector = 'h1.page-title';

        function initCicd() {
            var titleEl = document.querySelector(cicdTitleSelector);
            if (!titleEl) return;
            titleEl.style.cursor = 'pointer';
            titleEl.addEventListener('click', function(e) {
                e.stopPropagation();
                openCicdModal();
            });
            if (typeof window.CICD_RESULTS !== 'undefined' && window.CICD_RESULTS) {
                var status = window.CICD_RESULTS.status;
                if (status === 'fail') titleEl.classList.add('cicd-glow-fail');
                else if (status === 'pass') titleEl.classList.add('cicd-glow-pass');
            }
        }

        function openCicdModal() {
            var modal = document.getElementById('cicdModal');
            if (!modal) return;
            modal.classList.add('show');

            if (typeof window.CICD_RESULTS === 'undefined' || !window.CICD_RESULTS) {
                document.getElementById('cicdModalTitle').textContent = 'CI/CD Results';
                document.getElementById('cicdTabs').innerHTML = '';
                document.getElementById('cicdBody').innerHTML =
                    '<div class="cicd-no-data">No CI/CD data available.<br>Run generator with --cicd flag to create check results.</div>';
                return;
            }

            var data = window.CICD_RESULTS;
            document.getElementById('cicdModalTitle').textContent = 'CI/CD Results - ' + data.version;

            var tabsHtml = '';
            tabsHtml += '<div class="cicd-tab active" onclick="showCicdIteration(-1, this)">' + data.version + '</div>';
            if (data.iterations) {
                for (var i = 0; i < data.iterations.length; i++) {
                    var iter = data.iterations[i];
                    var failClass = iter.failed > 0 ? ' fail-tab' : '';
                    tabsHtml += '<div class="cicd-tab' + failClass + '" onclick="showCicdIteration(' + i + ', this)">' + iter.id + '</div>';
                }
            }
            document.getElementById('cicdTabs').innerHTML = tabsHtml;
            showCicdIteration(-1, document.querySelector('.cicd-tab.active'));
        }

        function showCicdIteration(index, tabEl) {
            document.querySelectorAll('.cicd-tab').forEach(function(t) { t.classList.remove('active'); });
            if (tabEl) tabEl.classList.add('active');

            var data = window.CICD_RESULTS;
            var body = document.getElementById('cicdBody');
            var iter;

            if (index === -1) {
                iter = data.iterations && data.iterations.length > 0
                    ? data.iterations[data.iterations.length - 1] : null;
            } else {
                iter = data.iterations[index];
            }

            if (!iter || !iter.html_file) {
                body.innerHTML = '<div class="cicd-no-data">No iteration data available.<br>Re-run with --cicd to generate.</div>';
                return;
            }

            var htmlPath = cicdResolvePath(iter.html_file);
            body.innerHTML = '<iframe id="cicdIframe" src="' + htmlPath + '" ' +
                'style="width:100%;border:none;min-height:400px;background:transparent;" ' +
                'onload="cicdAutoResize(this)"></iframe>';
        }

        function cicdAutoResize(iframe) {
            try {
                var h = iframe.contentDocument.body.scrollHeight;
                iframe.style.height = (h + 20) + 'px';
            } catch(e) { /* cross-origin fallback */ }
        }

        function cicdResolvePath(path) {
            var loc = window.location.href;
            if (loc.indexOf('/HTML/') !== -1) {
                return '../../' + path;
            }
            return path;
        }

        function closeCicdModal() {
            var modal = document.getElementById('cicdModal');
            if (modal) modal.classList.remove('show');
        }

        document.addEventListener('click', function(e) {
            var modal = document.getElementById('cicdModal');
            if (modal && e.target === modal) closeCicdModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeCicdModal();
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCicd);
        } else {
            initCicd();
        }
    
    </script>
</body>
</html>
